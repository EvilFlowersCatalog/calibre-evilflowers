name: Release

# Publish a GitHub release (web UI or `gh release create`) to build the plugin ZIP and
# attach it to that release. The tag (2.1.0 or v2.1.0) must match the version in
# calibre_plugin/__init__.py and pyproject.toml, and CHANGELOG.md must have a
# "## X.Y.Z - YYYY-MM-DD" section. A release published without notes gets that section.
#
# For a release that already exists, run this workflow by hand (Actions → Release →
# Run workflow) with its tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release, e.g. 2.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  attach:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      - name: Tag matches the plugin version
        run: python3 scripts/release.py check "$TAG"
      - name: Build plugin ZIP
        run: python3 scripts/build.py
      - name: Attach ZIP to the release
        run: gh release upload "$TAG" dist/evilflowers-*.zip --clobber
      - name: Fill empty release notes from CHANGELOG.md
        run: |
          body="$(gh release view "$TAG" --json body --jq .body)"
          if [ -z "$body" ]; then
            python3 scripts/release.py notes "$TAG" > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
