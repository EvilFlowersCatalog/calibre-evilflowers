name: Release

# Push a tag vX.Y.Z to publish a GitHub release with the plugin ZIP attached.
# The tag must match the version in calibre_plugin/__init__.py and pyproject.toml,
# and CHANGELOG.md must have a "## X.Y.Z - YYYY-MM-DD" section: it becomes the release notes.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the plugin version
        run: python3 scripts/release.py check "$GITHUB_REF_NAME"
      - name: Build plugin ZIP
        run: python3 scripts/build.py
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/evilflowers-*.zip \
            --title "EvilFlowers for Calibre ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
